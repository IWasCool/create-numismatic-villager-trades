plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    mavenCentral()
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

base {
    archivesName = mod_id
}

def testVillagersReborn = providers.gradleProperty('testVillagersReborn').map { it.toBoolean() }.getOrElse(false)
def testVillagerPreviews = providers.gradleProperty('testVillagerPreviews').map { it.toBoolean() }.getOrElse(false)

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (testVillagerPreviews) {
                sourceSet = sourceSets.test
                gameDirectory = layout.buildDirectory.dir(testVillagersReborn ? 'gametest-villagers-reborn' : 'gametest-vanilla')
            }
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'log4j2.configurationFile', file('build/moddev/clientLog4j2.xml').toURI().toString()

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG

        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            if (testVillagerPreviews) {
                sourceSet(sourceSets.test)
            }
        }
    }

    unitTest {
        enable()
        testedMod = mods.named(mod_id)
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "maven.modrinth:create:${create_version}"
    localRuntime "maven.modrinth:numismatics:${numismatics_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation "net.neoforged:testframework:${neo_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Exercise the actual coin registry on a server with no optional recipe viewer.
    testRuntimeOnly "maven.modrinth:create:${create_version}"
    testRuntimeOnly "maven.modrinth:numismatics:${numismatics_version}"
    if (testVillagersReborn) {
        testRuntimeOnly "maven.modrinth:villagers-reborn:${villagers_reborn_version}"
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('jar', Jar) {
    from 'LICENSE'
    from 'TEMPLATE_LICENSE.txt'
}

tasks.named('prepareNeoForgeTestFiles').configure {
    // Numismatics restores Log4j from this property, which must be a URI on Windows.
    systemProperties.put('log4j2.configurationFile', file('build/moddev/junit/log4j2.xml').toURI().toString())
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            numismatics_version_range: numismatics_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// Keep shipped trade data consistent with the pack's single-currency purchases.
tasks.register('validateTrades') {
    group = 'verification'
    description = 'Validates coin inputs, trade quantities, shared prices and enchanted-book progression.'
    def tradeFiles = fileTree('src/main/resources/data/numismatic_villager_trades/trades') {
        include '*.json'
    }
    inputs.files(tradeFiles)
    doLast {
        def coins = ['numismatics:spur': 1, 'numismatics:bevel': 8, 'numismatics:sprocket': 16,
                     'numismatics:cog': 64, 'numismatics:crown': 512, 'numismatics:sun': 4096]
        def functions = ['minecraft:set_count', 'villagerconfig:enchant_randomly'] as Set
        def quantity = { entry ->
            def setters = (entry.functions ?: []).findAll { it.function == 'minecraft:set_count' }
            if (setters.size() > 1) throw new GradleException('Multiple quantity setters in one trade entry')
            def amount = setters ? setters[0].count : 1
            if (!(amount instanceof Integer) || amount < 1 || amount > 64)
                throw new GradleException("Invalid trade quantity: ${amount}")
            amount
        }
        def sharedPrices = [:]
        def enchantments = [:]
        int total = 0
        tradeFiles.files.sort { it.name }.each { tradeFile ->
            def profession = tradeFile.name.replaceFirst(/\.json$/, '')
            def root = new groovy.json.JsonSlurper().parseText(tradeFile.getText('UTF-8').replace('\uFEFF', ''))
            def seen = [] as Set
            Integer previousPrice = null
            if (!root.tiers) throw new GradleException("Missing trade tiers: ${profession}")
            root.tiers.each { tier ->
                if (tier.total_exp_required != 0)
                    throw new GradleException("Runtime cannot unlock nonzero-XP tier: ${profession}")
                tier.groups.each { tradeGroup ->
                    if (tradeGroup.num_to_select != tradeGroup.trades.size())
                        throw new GradleException("Incorrect selection count: ${profession}")
                    tradeGroup.trades.each { trade ->
                        def label = "${profession}: ${trade.result.name}"
                        if (!coins.containsKey(trade.cost_a.name))
                            throw new GradleException("Purchase needs a coin primary input: ${label}")
                        if (profession == 'librarian') {
                            if (trade.cost_b?.name != 'minecraft:book' || quantity(trade.cost_b) != 1)
                                throw new GradleException("Librarian needs exactly one book: ${label}")
                        } else if (trade.cost_b != null) {
                            throw new GradleException("Only librarians may use a second input: ${label}")
                        }
                        [trade.cost_a, trade.cost_b, trade.result].findAll { it != null }.each { entry ->
                            quantity(entry)
                            if (entry.type != 'minecraft:item' || !(entry.name ==~ /[a-z0-9_.-]+:[a-z0-9\/._-]+/))
                                throw new GradleException("Invalid item entry: ${label}")
                            if ((entry.functions ?: []).any { !functions.contains(it.function) })
                                throw new GradleException("Unsupported loot function: ${label}")
                        }
                        if (trade.result.name.startsWith('simplylight:'))
                            throw new GradleException("Simply Light is absent from the v4.1 pack: ${label}")
                        if (trade.max_uses != null && (!(trade.max_uses instanceof Integer) || trade.max_uses < 1))
                            throw new GradleException("Invalid stock count: ${label}")
                        def enchant = (trade.result.functions ?: []).findAll { it.function == 'villagerconfig:enchant_randomly' }
                        if (profession == 'librarian' && enchant.size() != 1)
                            throw new GradleException("Librarian result needs one enchantment: ${label}")
                        if (enchant && (profession != 'librarian' || trade.result.name != 'minecraft:book'
                                || quantity(trade.result) != 1 || enchant.size() != 1
                                || enchant[0].include.size() != 1 || enchant[0].min_level != enchant[0].max_level
                                || !(enchant[0].min_level instanceof Integer) || enchant[0].min_level < 1))
                            throw new GradleException("Unsupported enchanted-book entry: ${label}")
                        def price = coins[trade.cost_a.name] * quantity(trade.cost_a)
                        if (quantity(trade.cost_a) > 7)
                            throw new GradleException("Price needs a cleaner coin tier (at most seven coins): ${label}")
                        def denomination = coins.findAll { id, value -> price % value == 0 }.max { it.value }.key
                        if (trade.cost_a.name != denomination)
                            throw new GradleException("Use the largest exact coin denomination: ${label}")
                        if (previousPrice != null && price < previousPrice)
                            throw new GradleException("Trades must run from cheap to expensive, preserving equal-price item order: ${label}")
                        previousPrice = price
                        def key = [trade.result.name, enchant ? enchant[0].include[0] : '', enchant ? enchant[0].min_level : 0]
                        if (!seen.add(key)) throw new GradleException("Duplicate offer: ${label}")
                        def previous = sharedPrices[key]
                        def outputCount = quantity(trade.result)
                        if (previous && previous.price * outputCount != price * previous.count)
                            throw new GradleException("Conflicting prices across professions: ${label}")
                        sharedPrices[key] = [price: price, count: outputCount]
                        if (enchant) {
                            def id = enchant[0].include[0]
                            if (!enchantments.containsKey(id)) enchantments[id] = [:]
                            enchantments[id][enchant[0].min_level] = price
                        }
                        total++
                    }
                }
            }
        }
        enchantments.each { id, levels ->
            (1..levels.keySet().max()).each { level ->
                if (!levels.containsKey(level)) throw new GradleException("Missing ${id} level ${level}")
                if (level > 1 && (levels[level] <= levels[level - 1] || levels[level] > 2 * levels[level - 1]))
                    throw new GradleException("Inconsistent enchanted-book price ladder: ${id} level ${level}")
            }
        }
        if (total == 0) throw new GradleException('No trades were validated')
        logger.lifecycle("Validated ${total} trades across ${tradeFiles.files.size()} professions; one coin type per purchase.")
    }
}

tasks.register('validateTranslations') {
    group = 'verification'
    description = 'Checks locale key coverage and matching translation placeholders.'
    def languageFiles = fileTree('src/main/resources/assets/numismatic_villager_trades/lang') {
        include '*.json'
    }
    def englishFile = file('src/main/resources/assets/numismatic_villager_trades/lang/en_us.json')
    inputs.files(languageFiles)
    doLast {
        def parse = { languageFile ->
            new groovy.json.JsonSlurper().parseText(languageFile.getText('UTF-8').replace('\uFEFF', ''))
        }
        def english = parse(englishFile)
        def placeholders = { text ->
            (text =~ /(?<!%)%(?:\d+\$)?[sd]/).collect { it[-1] }.sort()
        }
        languageFiles.files.each { languageFile ->
            def translated = parse(languageFile)
            def missing = english.keySet() - translated.keySet()
            if (missing) throw new GradleException("Missing translation keys in ${languageFile.name}: ${missing}")
            english.each { key, value ->
                if (!(translated[key] instanceof String) || translated[key].isBlank())
                    throw new GradleException("Empty or invalid translation in ${languageFile.name}: ${key}")
                if (placeholders(value) != placeholders(translated[key]))
                    throw new GradleException("Translation placeholder mismatch in ${languageFile.name}: ${key}")
            }
        }
        logger.lifecycle("Validated ${english.size()} translation keys across ${languageFiles.files.size()} locales.")
    }
}

tasks.named('check') {
    dependsOn tasks.named('validateTrades')
    dependsOn tasks.named('validateTranslations')
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
