name: Build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Check existing villager ordering and previews
        run: ./gradlew runGameTestServer -PtestVillagerPreviews=true --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: numismatic-villager-trades-neoforge
          path: build/libs/*.jar
          if-no-files-found: error
